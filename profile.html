<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBSE Pro • Profile</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{font:14px system-ui;background:#f5f7fb;color:#182033;margin:0;padding:40px}.box{max-width:560px;margin:auto;background:#fff;padding:30px;border-radius:20px;box-shadow:0 15px 50px #18203312}input{width:100%;padding:13px;margin:7px 0 15px;box-sizing:border-box;border:1px solid #ddd;border-radius:10px}button{padding:12px 16px;border:0;border-radius:10px;background:#635bff;color:#fff;font-weight:700;margin-right:8px;cursor:pointer}.secondary{background:#eef0f6;color:#333}.msg{margin:14px 0;color:#667085}a{color:#635bff;text-decoration:none}</style></head><body><div class="box"><h1>Student Profile 🎓</h1><p id="email"></p><label>Full name</label><input id="name" maxlength="40"><label>Class</label><input value="Class 10" disabled><button id="save">Save profile</button><button class="secondary" id="out">Sign out</button><p class="msg" id="msg"></p><a href="index.html">← Back to dashboard</a></div><script>(async()=>{if(!window.CBSE_SUPABASE_URL||window.CBSE_SUPABASE_URL==='YOUR_SUPABASE_PROJECT_URL'){document.getElementById('msg').textContent='Connect Supabase first.';return}const sb=supabase.createClient(window.CBSE_SUPABASE_URL,window.CBSE_SUPABASE_KEY);const {data:{session}}=await sb.auth.getSession();if(!session){location.href='auth.html';return}email.textContent=session.user.email;name.value=session.user.user_metadata?.full_name||'';save.onclick=async()=>{const n=name.value.trim();if(!n)return;const r=await sb.auth.updateUser({data:{full_name:n}});if(r.error){msg.textContent=r.error.message;return}await sb.from('profiles').upsert({id:session.user.id,full_name:n,updated_at:new Date().toISOString()});localStorage.setItem('cbseStudentName',n);msg.textContent='Profile saved ✓'};out.onclick=async()=>{await sb.auth.signOut();location.href='auth.html'}})()</script></body></html>
