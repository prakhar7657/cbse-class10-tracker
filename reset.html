<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBSE Pro • Reset password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{font:14px system-ui;background:#f5f7fb;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:30px;border-radius:20px;width:min(400px,calc(100% - 40px));box-shadow:0 15px 50px #0001}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border-radius:10px}input{border:1px solid #ddd}button{border:0;background:#635bff;color:white;font-weight:700}.msg{margin-top:12px}</style></head><body><div class="box"><h2>Set a new password</h2><input id="pass" type="password" placeholder="New password"><button id="save">Update password</button><div id="msg" class="msg"></div></div><script>const sb=supabase.createClient(window.CBSE_SUPABASE_URL,window.CBSE_SUPABASE_KEY);save.onclick=async()=>{if(pass.value.length<6){msg.textContent='Password must be at least 6 characters.';return}const r=await sb.auth.updateUser({password:pass.value});msg.textContent=r.error?r.error.message:'Password updated. You can now sign in.';if(!r.error)setTimeout(()=>location.href='auth.html',1200)}</script></body></html>
